# Fallback only. LiftingTracker.xcodeproj is already in the repo; if Xcode
# cannot open it, install XcodeGen (brew install xcodegen) and run `xcodegen`
# in this folder to regenerate it from this file.
name: LiftingTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  LiftingTracker:
    type: application
    platform: iOS
    sources: [LiftingTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LiftingTracker
        INFOPLIST_KEY_CFBundleDisplayName: Lifting Tracker
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  LiftingTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LiftingTrackerTests]
    dependencies:
      - target: LiftingTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LiftingTrackerTests
  LiftingTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LiftingTrackerUITests]
    dependencies:
      - target: LiftingTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LiftingTrackerUITests
schemes:
  LiftingTracker:
    build:
      targets:
        LiftingTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiftingTrackerTests
        - LiftingTrackerUITests
